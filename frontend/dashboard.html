<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Hospital Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand mb-0 h1">Hospital Management System</span>
    <div>
      <span id="userName" class="text-white me-3"></span>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </nav>

 <div class="container mt-4">
  <div class="card p-4 mb-4 shadow-sm" style="background: linear-gradient(135deg, #2563eb, #1e40af); color: white;">
    <h3 class="mb-1">Welcome back, <span id="welcomeName"></span>! 👋</h3>
    <p class="mb-0" id="currentDate" style="opacity: 0.9;"></p>
  </div>

  <h3>Dashboard</h3>

    <div class="row mt-4" id="statsCards">
      <div class="col-md-4">
        <div class="card p-3 text-center shadow-sm">
          <i class="bi bi-people-fill stat-icon patients"></i>
          <h6 class="text-muted">Total Patients</h6>
          <h2 id="totalPatients">-</h2>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 text-center shadow-sm">
          <i class="bi bi-heart-pulse-fill stat-icon doctors"></i>
          <h6 class="text-muted">Total Doctors</h6>
          <h2 id="totalDoctors">-</h2>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 text-center shadow-sm">
          <i class="bi bi-calendar-check-fill stat-icon appointments"></i>
          <h6 class="text-muted">Today's Appointments</h6>
          <h2 id="todayAppointments">-</h2>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <a href="patients.html" class="btn btn-primary me-2"><i class="bi bi-people-fill"></i> Manage Patients</a>
      <a href="doctors.html" class="btn btn-primary me-2"><i class="bi bi-heart-pulse-fill"></i> Manage Doctors</a>
      <a href="appointments.html" class="btn btn-primary me-2"><i class="bi bi-calendar-check-fill"></i> Manage Appointments</a>
      <a href="records.html" class="btn btn-primary"><i class="bi bi-file-medical-fill"></i> Medical Records</a>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
