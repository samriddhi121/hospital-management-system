<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctors - Hospital Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand mb-0 h1">Hospital Management System</span>
    <div>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Doctors</h3>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addDoctorModal">
        <i class="bi bi-plus-circle"></i> Add Doctor
      </button>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>

    <div id="loadingSpinner" class="spinner-container">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <table class="table table-bordered bg-white d-none" id="doctorsTable">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Specialization</th>
          <th>Availability</th>
          <th>Contact</th>
        </tr>
      </thead>
      <tbody id="doctorsTableBody"></tbody>
    </table>
  </div>

  <div class="modal fade" id="addDoctorModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Doctor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addDoctorForm">
            <div class="mb-3">
              <label class="form-label">User ID (registered user ka ID)</label>
              <input type="number" class="form-control" id="userId" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Specialization</label>
              <input type="text" class="form-control" id="specialization" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Availability</label>
              <input type="text" class="form-control" id="availability" placeholder="e.g. Mon-Fri 10am-4pm">
            </div>
            <div class="mb-3">
              <label class="form-label">Contact</label>
              <input type="text" class="form-control" id="contact" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-check-circle"></i> Add Doctor
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/doctors.js"></script>
</body>
</html>
