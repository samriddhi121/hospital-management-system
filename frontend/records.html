<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Records - Hospital Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand mb-0 h1">Hospital Management System</span>
    <div>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h3><i class="bi bi-file-medical-fill"></i> Medical Records</h3>
    <p class="text-muted" id="pageInfo"></p>

    <div id="errorMessage" class="alert alert-danger d-none"></div>

    <table class="table table-bordered bg-white">
      <thead class="table-light" id="tableHead">
        <!-- JavaScript decide karega columns kya honge -->
      </thead>
      <tbody id="recordsTableBody"></tbody>
    </table>
  </div>

  <script src="js/records.js"></script>
</body>
</html>
