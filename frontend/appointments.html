<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments - Hospital Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand mb-0 h1">Hospital Management System</span>
    <div>
      <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Appointments</h3>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bookModal">
        <i class="bi bi-calendar-plus"></i> Book Appointment
      </button>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>

    <table class="table table-bordered bg-white">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Patient</th>
          <th>Doctor</th>
          <th>Specialization</th>
          <th>Time</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="appointmentsTableBody"></tbody>
    </table>
  </div>

  <div class="modal fade" id="bookModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Book Appointment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="bookForm">
            <div class="mb-3">
              <label class="form-label">Patient ID</label>
              <input type="number" class="form-control" id="patientId" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Doctor ID</label>
              <input type="number" class="form-control" id="doctorId" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Date &amp; Time</label>
              <input type="datetime-local" class="form-control" id="slotTime" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-check-circle"></i> Book
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/appointments.js"></script>
</body>
</html>
